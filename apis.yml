aid: bluestar-genomics
name: ClearNote Health
description: 'ClearNote Health (formerly Bluestar Genomics) is a US cancer detection
  company with offices in San Diego and San Mateo, California. Its proprietary 5hmC
  epigenomic platform combines cell-free DNA sequencing from a standard blood draw
  with machine learning to identify DNA-based alterations as cancer develops. The
  company commercializes Avantect, a suite of early-detection liquid biopsy tests
  for pancreatic and ovarian cancer that clinicians order through its laboratory,
  and Virtuoso, a research-use-only epigenomics platform sold to biopharma for drug
  discovery, therapy response and resistance research. ClearNote Health publishes
  no public developer program, API, SDK, or machine-readable specification: the
  clinician ordering path is a hosted intake form, and its public GitHub organization
  contains only forks of open-source bioinformatics tooling.'
